<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <div id="kdu-app">
    <!-- bag image -->
    <div id="bag" k-bind:class="{ burst: ended }"></div>

    <!-- bag health -->
    <div id="bag-health">
      <div k-bind:style="{ width: health + '%' }"></div>
    </div>

    <!-- game controls -->
    <div id="controls">
      <button k-on:click="punch" k-show="!ended">Punch</button>
      <button k-on:click="restart">Restart</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
