<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <div id="kdu-app">
    <h1>Conditionals</h1>

    <button k-on:click="error = !error">Toggle Error</button>
    <button k-on:click="success = !success">Toggle Success</button>

    <p k-if="error">There has been an error</p>
    <p k-else-if="success">Whooo, success :)</p>

    <p k-show="error">There has been an error</p>
    <p k-show="success">Whooo, success :)</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
