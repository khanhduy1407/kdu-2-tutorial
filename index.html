<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <h1>Multiple Kdu Instances</h1>

  <div id="kdu-app-one">
    <h2>{{ title }}</h2>
    <p>{{ greet }}</p>
  </div>

  <div id="kdu-app-two">
    <h2>{{ title }}</h2>
    <p>{{ greet }}</p>
    <button k-on:click="changeTitle">Change App One Title</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
