<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <div id="kdu-app">
    <h1>Looping through lists</h1>

    <ul>
      <li k-for="(character, index) in characters">{{ index }} . {{ character }}</li>
    </ul>
    <ul>
      <li k-for="(ninja, index) in ninjas">{{ index }} . {{ ninja.name }} - {{ ninja.age }}</li>
    </ul>

    <template k-for="(ninja, index) in ninjas">
      <h3>{{ index }} . {{ ninja.name }}</h3>
      <p>{{ ninja.age }}</p>
    </template>

    <template k-for="ninja in ninjas">
      <div k-for="(val, key) in ninja">
        <p>{{ key }} - {{ val }}</p>
      </div>
    </template>
  </div>

  <script src="app.js"></script>
</body>
</html>
