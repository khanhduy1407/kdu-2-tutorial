<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <div id="kdu-app">
    <h1>Dynamic CSS</h1>
    
    <h2>Example 1</h2>
    <div k-on:click="available = !available" k-bind:class="{available: available}">
      <span>NKDuy</span>
    </div>

    <h2>Example 2</h2>
    <button k-on:click="available = !available">Toogle available</button>
    <button k-on:click="nearby = !nearby">Toogle nearby</button>
    <div k-bind:class="compClasses">
      <span>NKDuy</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
