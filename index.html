<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kdu2 Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/kdu@2.6.15"></script>
</head>
<body>
  <div id="kdu-app">
    <h1>Keyboard Events</h1>

    <label>Name:</label>
    <input type="text" k-on:keyup.enter="logName" />
    <label>Age:</label>
    <input type="text" k-on:keyup.alt.enter="logAge" />
    <label>Job:</label>
    <input type="text" k-on:keyup="logJob" />
  </div>

  <script src="app.js"></script>
</body>
</html>
